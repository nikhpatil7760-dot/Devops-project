name: Flask CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build-scan-publish:
    name: Test, build, scan, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r app/requirements-dev.txt

      - name: Run tests
        run: python -m pytest app/test_app.py

      - name: Build Docker image
        run: docker build --pull --tag "devops-platform:${{ github.sha }}" .

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Scan Docker image
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "devops-platform:${{ github.sha }}"