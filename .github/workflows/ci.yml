name: DevOps CI

on:
  push:
  pull_request:

jobs:
  validate-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Setup Kind
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-cluster

      - name: Deploy Application
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml

      - name: Health Check
        run: |
          if ! kubectl rollout status deployment/podinfo -n podinfo --timeout=120s; then
            echo "Deployment failed. Starting rollback..."
            kubectl rollout undo deployment/podinfo -n podinfo
            kubectl rollout status deployment/podinfo -n podinfo --timeout=120s
            exit 1
          fi

      - name: Verify Deployment
        run: |
          kubectl get pods -n podinfo
          kubectl get service -n podinfo
