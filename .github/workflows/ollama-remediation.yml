name: Ollama remediation

on:
  workflow_dispatch:
    inputs:
      incident_run_id:
        description: "Failed CI run ID whose incident-evidence artifact should be reviewed"
        required: true
        type: string
      apply_changes:
        description: "Apply, test, commit, and push Ollama's validated patch"
        required: true
        default: false
        type: boolean
      target_branch:
        description: "Branch to update when apply_changes is enabled"
        required: true
        default: main
        type: string

permissions:
  actions: read
  contents: write

jobs:
  propose-or-apply:
    runs-on: self-hosted
    environment: ollama-remediation
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Download incident evidence
        uses: actions/download-artifact@v4
        with:
          name: incident-evidence-${{ inputs.incident_run_id }}
          run-id: ${{ inputs.incident_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .local/incidents

      - name: Generate and validate Ollama remediation patch
        shell: cmd
        run: python scripts/ollama-remediation.py --evidence-dir .local/incidents --patch-output .local/ollama-remediation.patch --timeout-seconds 180

      - name: Upload proposed patch
        uses: actions/upload-artifact@v4
        with:
          name: ollama-remediation-patch-${{ github.run_id }}
          path: .local/ollama-remediation.patch

      - name: Apply, test, and push approved patch
        if: inputs.apply_changes == true
        shell: cmd
        run: |
          git apply --check --recount .local/ollama-remediation.patch
          git apply --recount .local/ollama-remediation.patch
          python -m pytest app/test_app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply Ollama remediation for incident ${{ inputs.incident_run_id }}"
          git push origin HEAD:${{ inputs.target_branch }}