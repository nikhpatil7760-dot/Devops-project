name: Flask CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    name: Test, build, and deploy
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner Python
        shell: cmd
        run: |
          for /f "delims=" %%P in ('py -3.12 -c "import sys; print(sys.executable)"') do set "PYTHON_PATH=%%P"
          for %%D in ("%PYTHON_PATH%") do set "PYTHON_DIR=%%~dpD"
          set "PATH=%PYTHON_DIR%;%PYTHON_DIR%Scripts;%PATH%"
          >> "%GITHUB_PATH%" echo %PYTHON_DIR%
          >> "%GITHUB_PATH%" echo %PYTHON_DIR%Scripts
          python --version
          python -m ensurepip --upgrade
          python -m pip --version
      - name: Install dependencies
        run: python -m pip install -r app/requirements-dev.txt

      - name: Run tests
        run: python -m pytest app/test_app.py

      - name: Build Docker image
        run: docker build --pull --tag "devops-platform:${{ github.sha }}" .
      - name: Select existing Kind cluster
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: kubectl config use-context kind-flask-platform

      - name: Load image into existing Kind cluster
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: kind load docker-image "devops-platform:${{ github.sha }}" --name flask-platfo

      - name: Apply Flask Kubernetes resources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/deployment.yaml
          kubectl set image deployment/flask-app flask-app="devops-platform:${{ github.sha }}" --namespace flask-app
          kubectl set env deployment/flask-app APP_VERSION="${{ github.sha }}" --namespace flask-app

      - name: Validate rollout and health (RCA and rollback on failure)
        id: validate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: python scripts/deployment_check.py --namespace flask-app --timeout-seconds 120
      - name: Run AI RCA for CD failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: cmd
        run: |
          if not exist ".local\incidents" mkdir ".local\incidents"
          set "EVIDENCE=.local\incidents\github-actions-incident-%GITHUB_RUN_ID%.txt"
          python scripts/ai-rca.py --namespace flask-app --evidence-only --evidence-output "%EVIDENCE%"
          python scripts/ai-rca.py --namespace flask-app --evidence-file "%EVIDENCE%" --timeout-seconds 30