name: Flask CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scenario:
        description: "Choose the normal deployment or the intentional image-load failure demo"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - intentional-image-load-failure

permissions:
  contents: read

jobs:
  test-build:
    name: Test, build, and deploy
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner Python
        shell: cmd
        run: |
          for /f "delims=" %%P in ('py -3.12 -c "import sys; print(sys.executable)"') do set "PYTHON_PATH=%%P"
          for %%D in ("%PYTHON_PATH%") do set "PYTHON_DIR=%%~dpD"
          set "PATH=%PYTHON_DIR%;%PYTHON_DIR%Scripts;%PATH%"
          >> "%GITHUB_PATH%" echo %PYTHON_DIR%
          >> "%GITHUB_PATH%" echo %PYTHON_DIR%Scripts
          python --version
          python -m ensurepip --upgrade
          python -m pip --version

      - name: Install dependencies
        run: python -m pip install -r app/requirements-dev.txt

      - name: Run tests
        run: python -m pytest app/test_app.py

      - name: Build Docker image
        run: docker build --pull --tag "devops-platform:${{ github.sha }}" .

      - name: Select existing Kind cluster
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        shell: cmd
        run: kubectl config use-context kind-flask-plat

      - name: Load normal image into existing Kind cluster
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.scenario == 'normal'))
        shell: cmd
        run: kind load docker-image "devops-platform:${{ github.sha }}" --name flask-platform

      - name: Load intentionally invalid image name
        if: success() && github.event_name == 'workflow_dispatch' && inputs.scenario == 'intentional-image-load-failure'
        shell: cmd
        run: |
          if not exist ".local\incidents" mkdir ".local\incidents"
          kind load docker-image "devops-platfo:${{ github.sha }}" --name flask-platform > ".local\incidents\pipeline-image-load.log" 2>&1
          type ".local\incidents\pipeline-image-load.log"
          exit /b 1

      - name: Apply Flask Kubernetes resources
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.scenario == 'normal'))
        shell: cmd
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/deployment.yaml
          kubectl set image deployment/flask-app flask-app="devops-platform:${{ github.sha }}" --namespace flask-app
          kubectl set env deployment/flask-app APP_VERSION="${{ github.sha }}" --namespace flask-app

      - name: Validate rollout and health (RCA and rollback on failure)
        id: validate
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.scenario == 'normal'))
        shell: cmd
        run: python scripts/deployment_check.py --namespace flask-app --timeout-seconds 120

      - name: Run AI RCA for CD failure
        if: failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        shell: cmd
        run: |
          if not exist ".local\incidents" mkdir ".local\incidents"
          set "EVIDENCE=${{ steps.validate.outputs.incident_evidence }}"
          if not defined EVIDENCE set "EVIDENCE=.local\incidents\github-actions-incident-${{ github.run_id }}.txt"
          if not exist "%EVIDENCE%" python scripts/ai-rca.py --namespace flask-app --evidence-only --evidence-output "%EVIDENCE%"
          if "${{ github.event_name }}"=="workflow_dispatch" if "${{ inputs.scenario }}"=="intentional-image-load-failure" (
            >> "%EVIDENCE%" echo.
            >> "%EVIDENCE%" echo PIPELINE FAILURE:
            >> "%EVIDENCE%" echo Failed stage: image loading.
            >> "%EVIDENCE%" echo Kubernetes deployment was not attempted because the image-loading command failed.
            >> "%EVIDENCE%" echo Runtime command output:
            if exist ".local\incidents\pipeline-image-load.log" type ".local\incidents\pipeline-image-load.log" >> "%EVIDENCE%"
          )
          set "REPORT=.local\incidents\incident-report-%GITHUB_RUN_ID%.md"
          python scripts/ai-rca.py --namespace flask-app --evidence-file "%EVIDENCE%" --report-output "%REPORT%" --timeout-seconds 120
          type "%REPORT%"
          type "%REPORT%" >> "%GITHUB_STEP_SUMMARY%"
          >> "%GITHUB_STEP_SUMMARY%" echo.
          >> "%GITHUB_STEP_SUMMARY%" echo NEXT ACTION: If the report identifies a code or configuration change, a human must review the evidence and manually start the Ollama remediation workflow.
          >> "%GITHUB_STEP_SUMMARY%" echo The remediation workflow creates a reviewable patch and applies it only when human approval enables apply_changes.

      - name: Upload incident evidence
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: incident-evidence-${{ github.run_id }}
          path: .local/incidents
          if-no-files-found: warn
