```yaml
name: DevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f kubernetes/namespace.yaml
          kubectl apply --dry-run=client -f kubernetes/deployment.yaml
          kubectl apply --dry-run=client -f kubernetes/service.yaml

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Trivy Configuration Scan
        run: trivy config .
```